;
; PHP-FPM pool for the Dero dashboard.
;
; Ordinary Laravel workload: short requests, dynamic process management.
;
; Install to /etc/php/8.4/fpm/pool.d/dero-web.conf
;
[dero-web]

user = dero
group = dero

listen = /run/php/dero-web.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 32M

php_admin_value[expose_php] = Off
php_admin_flag[display_errors] = Off
php_admin_value[error_log] = /var/log/php-fpm/dero-web.error.log
php_admin_flag[log_errors] = On
