;
; PHP-FPM pool for the Dero S3 API.
;
; Separate from the dashboard pool on purpose: a burst of 1 GB uploads must not
; exhaust the workers serving the dashboard, and the two have genuinely
; different timeout and body-size requirements. Sharing one pool means a slow
; upload can make the dashboard unreachable.
;
; Install to /etc/php/8.4/fpm/pool.d/dero-s3.conf
;
[dero-s3]

user = dero
group = dero

listen = /run/php/dero-s3.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Static, and sized to CPU rather than RAM. These workers are I/O-blocked on
; streaming rather than memory-hungry, so the usual "RAM / memory_limit"
; calculation over-provisions badly. Start at roughly 4x vCPU and measure.
pm = static
pm.max_children = 16

; Workers are recycled to bound the effect of any leak in a long-lived process.
pm.max_requests = 500

; 256M is deliberate and should not be raised to make an upload work.
;
; Everything in Dero streams, so peak memory is bounded by S3_STREAM_CHUNK_SIZE
; rather than by object size. If a 1 GB upload needs more than 256M, streaming
; has regressed somewhere and the limit is hiding the bug.
; tests/Feature/S3/MemoryProfileTest.php exists to catch exactly that.
php_admin_value[memory_limit] = 256M

; Must agree with client_max_body_size in the Nginx S3 block and with
; S3_MAX_UPLOAD_SIZE in .env. A mismatch truncates the body with no useful
; error.
php_admin_value[post_max_size] = 5G
php_admin_value[upload_max_filesize] = 5G

; A 1 GB transfer over a slow link legitimately takes minutes.
php_admin_value[max_execution_time] = 3600
php_admin_value[max_input_time] = 3600

; PHP appends this to any text/* Content-Type at header-send time. Dero clears
; it per request for S3 routes — an object stored as "text/markdown" must not
; read back as "text/markdown;charset=UTF-8" — but clearing it here too means
; the behaviour does not depend on that one line.
php_admin_value[default_charset] =

php_admin_value[expose_php] = Off
php_admin_flag[display_errors] = Off
php_admin_value[error_log] = /var/log/php-fpm/dero-s3.error.log
php_admin_flag[log_errors] = On

; Uploads never reach PHP's own multipart handling — Dero reads the body as a
; stream — so PHP's temp-file upload machinery is dead weight here.
php_admin_flag[file_uploads] = Off
