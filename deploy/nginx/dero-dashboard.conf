#
# Dero dashboard — dero.example.com
#
# A conventional Laravel server block. The S3 API is deliberately NOT served
# from this hostname: the dashboard mounts team pages at the application root
# (/{team}/overview) and the S3 API needs /{bucket}/{key}, a wildcard that would
# swallow every dashboard URL.
#
# Replace dero.example.com throughout, then:
#   sudo certbot --nginx -d dero.example.com
#

server {
    listen 80;
    listen [::]:80;
    server_name dero.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dero.example.com;

    root /var/www/dero/public;
    index index.php;

    # ssl_certificate / ssl_certificate_key are added by certbot.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/dero-dashboard.access.log;
    error_log  /var/log/nginx/dero-dashboard.error.log;

    charset utf-8;
    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite fingerprints its build output, so it is safe to cache indefinitely.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/dero-web.sock;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
