#
# Dero S3 API — s3.dero.example.com
#
# Four settings here are load-bearing and are flagged in place. Changing them
# without reading the comment is how the streaming design gets silently undone.
#
# Replace s3.dero.example.com throughout, then let certbot add the TLS block:
#   sudo certbot --nginx -d s3.dero.example.com
#

server {
    listen 80;
    listen [::]:80;
    server_name s3.dero.example.com *.s3.dero.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # The wildcard serves virtual-host addressing (bucket.s3.dero.example.com).
    # Drop it, and the matching DNS record, if you only need path style.
    server_name s3.dero.example.com *.s3.dero.example.com;

    root /var/www/dero/public;
    index index.php;

    # ssl_certificate / ssl_certificate_key are added by certbot.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/dero-s3.access.log;
    error_log  /var/log/nginx/dero-s3.error.log;

    # (1) Sized deliberately from S3_MAX_UPLOAD_SIZE — NOT 0.
    #
    # "0" disables the limit, which turns a request-size bug into a
    # disk-exhaustion incident. Keep this in agreement with post_max_size in the
    # FPM pool and with S3_MAX_UPLOAD_SIZE in .env: a mismatch produces a
    # truncated body with no useful error, which is very hard to diagnose.
    client_max_body_size 5g;

    # (2) Objects are opaque bytes, frequently already compressed. Re-compressing
    # them wastes CPU and breaks Content-Length, which S3 clients rely on.
    gzip off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/dero-s3.sock;

        # (3) REQUIRED for PHP-FPM. Nginx must finish receiving a request before
        # handing it to PHP. AWS CLI uploads use HTTP Transfer-Encoding: chunked
        # plus an inner aws-chunked payload; with request buffering disabled,
        # php://input can be exposed as an empty EOF stream at the moment the
        # Laravel handler opens it. Nginx writes the request to its temp path,
        # while PHP still streams that completed body into object storage and
        # never buffers the object in application memory.
        fastcgi_request_buffering on;

        # (4) A 1 GB transfer over a slow link legitimately exceeds the 60s
        # default. The failure mode is a truncated body with no error.
        fastcgi_read_timeout 3600;
        fastcgi_send_timeout 3600;
        send_timeout 3600;

        # Body size is not known in advance for a streamed upload.
        fastcgi_buffering off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    #
    # Optional: let Nginx serve object bytes directly and release the PHP worker
    # as soon as the authorisation decision is made.
    #
    # OFF BY DEFAULT, and it should stay off until you understand it: this
    # bypasses PHP for the response body, so anything PHP would have done after
    # the decision — including the byte accounting in usage_records — does not
    # happen for the bytes Nginx sends. Enabling it also requires application
    # support that is not built yet.
    #
    # location /internal-objects/ {
    #     internal;
    #     alias /srv/dero-storage/;
    # }
}
