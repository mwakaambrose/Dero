      - generic [ref=e33]:
        - generic [ref=e34]:
          - paragraph [ref=e35]: Someone else’s cloud
          - paragraph [ref=e36]: Straightforward to start, then the egress bill arrives and your data lives somewhere you cannot inspect.
        - generic [ref=e37]:
          - paragraph [ref=e38]: A cluster to operate
          - paragraph [ref=e39]: Full control, at the cost of running distributed storage you now have to keep alive yourself.
        - generic [ref=e40]:
          - paragraph [ref=e41]: "Dero: one application, one server"
          - paragraph [ref=e42]: Install it on a VPS, point your S3 client at it, and carry on. No cluster, no egress charges, no vendor.
