        - generic [ref=e53]:
          - heading "Multipart uploads" [level=3] [ref=e58]
          - paragraph [ref=e59]: Large objects arrive in parts and are assembled server-side, with the ETag AWS clients expect.
        - generic [ref=e60]:
          - heading "Range requests" [level=3] [ref=e67]
          - paragraph [ref=e68]: Byte ranges return 206 with a correct Content-Range, so video seeking and resumable downloads work.
        - generic [ref=e69]:
